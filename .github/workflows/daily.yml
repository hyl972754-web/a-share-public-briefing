name: Free A-share morning briefing
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # UTC 00:00 = Asia/Shanghai 08:00; can be delayed.
    - cron: '15 0 * * *' # automatic retry/check at 08:15; successful daily JSON is immutable.
permissions:
  contents: read
concurrency:
  group: public-daily-briefing
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    outputs:
      result: ${{ steps.collection.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Test public package (standard library only)
        run: |
          python -m unittest discover -s tests/public -v
          node tests/public/view.test.cjs
      - name: Collect public headlines (bounded per-source retry)
        id: collection
        shell: bash
        run: |
          set +e
          python -m app.public_digest.pipeline --root . --edition morning
          result=$?
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit only public report files, never the whole project
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/index.json data/status.json
          shopt -s nullglob
          reports=(data/reports/*.json)
          if (( ${#reports[@]} )); then git add -- "${reports[@]}"; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update public briefing metadata'
            git push
          fi
  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build explicit static artifact only
        run: python -m app.public_digest.package build site --root .
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          retention-days: 1
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Mark collection failure after publishing honest status
        if: needs.collect.outputs.result != '0'
        run: |
          echo 'Collection failed. Published the failure marker and retained successful archives.'
          exit 1
